<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>login-controle de gasto</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <form action="">
      <div>
        <div><label for="">Email</label></div>
        <input
          type="email"
          name="email"
          id="email"
          placeholder="seu@gmail.com"
          onchange="validatefields()"
        />
      </div>
      <div>
        <div><label for="">Senha</label></div>
        <input
          type="password"
          name="senha"
          placeholder="senha"
          id="password"
          onchange="validatefields()"
        />
      </div>
      =
      <div>
        <button
          type="button"
          class="clear"
          id="recover-password-button"
          disabled="true"
        >
          Recuperar senha
        </button>
      </div>
      <div>
        <button type="button" class="solid" disabled="true" id="login-button">
          Entrar
        </button>
      </div>
      <div><button type="button" class="outline">Registrar</button></div>
    </form>
  </body>
  <script src="index.js"></script>
</html>
